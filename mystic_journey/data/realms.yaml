# ============================================================================
# The Traveler's Atlas — single source of truth for the mystic_journey site.
#
# Everything display-related lives here: names, teasers, palettes, positions,
# character anchors. Templates NEVER hardcode realm names — rename freely.
#
# Factual project content (role, results, links, body text) is NOT duplicated
# here: realms with a `content:` path pull frontmatter + body from that file
# in the repo's shared content/ folder (read-only) at build time.
#
# status values:
#   live         -> full realm page from real content
#   in-progress  -> keyart exists, content pending; island dimmer/hazier,
#                   realm page is a structured shell with TODO placeholders
#   horizon      -> upcoming work; dimmest island, capabilities-only text
#   stub         -> placeholder island + "coming soon" page (wanderings)
#
# position: base viewport-percentage coords (x → right, y → down), jittered
# ±2.5% by JS on each load with a minimum-distance rule.
# size: lg | md | sm      depth: near | mid | far
# ============================================================================

site:
  owner: "Vishal Gaur"
  page_title: "Vishal Gaur — ML Engineer & Researcher | The Traveler's Atlas"
  meta_description: >-
    Portfolio of Vishal Gaur, machine learning engineer and researcher —
    foundation models for heliophysics, weather & climate, and Earth
    observation at NASA, plus production ML systems. Explore each project
    as a realm in the Traveler's Atlas.
  # TODO: confirm the deployed base URL for mystic_journey before going live
  # (used for sitemap.xml and og:url / og:image absolute links).
  base_url: "https://swordsaintlancelot.github.io/mystic_journey"
  classic_url: "/index.html"        # the existing classic site (docs/index.html when deployed)
  resume_src: "static/resume.pdf"   # copied into mystic_journey/assets/ at build
  background:
    webp: "images/pillars_of_creation_3840x2160_q82.webp"
    avif: "images/pillars_of_creation_3840x2160_q60.avif"

guide:
  name: "The Wayfinder"
  image_webp: "images/character.webp"
  image_avif: "images/character.avif"
  greeting: "Hey, welcome traveler! Which project would you like to see?"
  hint: "Select any realm to unlock the mysteries of the project."
  # Hand-picked anchor positions (viewport %). One per load, chosen at random.
  # None sit inside the wanderings cluster bounds (x < 30, y > 62) except the
  # single deliberate "visiting" anchor at its edge.
  anchors:
    - { x: 12, y: 26, remark: "Every one of these worlds began as a dataset." }
    - { x: 50, y: 30, remark: "The pillars never stop burning. Neither does the training run." }
    - { x: 88, y: 46, remark: "Some realms are still forming. Give them time." }
    - { x: 64, y: 78, remark: "I have walked every realm here. Ask me anything." }
    - { x: 34, y: 58, remark: "Charts, checkpoints, chronicles — I keep them all." }
    - { x: 78, y: 16, remark: "From up here you can see how the projects connect." }
    - { x: 30, y: 80, visiting: true, remark: "Even a traveler rests sometimes. These are the wanderings." }

clusters:
  works:
    # spread across most of the viewport; no label
    bounds: { x_min: 8, x_max: 93, y_min: 12, y_max: 88 }
  wanderings:
    caption: "Wanderings"        # whisper-quiet, fades in after the intro
    warm: true                   # warmer tint on these islands
    bounds: { x_min: 6, x_max: 27, y_min: 64, y_max: 90 }

realms:
  # ------------------------------------------------------------------- works
  - slug: surya
    cluster: works
    status: live
    mythic_name: "The Sunforge"
    professional_name: "Surya — Heliophysics Foundation Model"
    teaser: "In the Sunforge, fourteen years of the sun's moods are read like prophecy — flares called before they break."
    palette: { accent: "#FF8A3D", glow: "#FF5A1F" }
    position: { x: 70, y: 22 }
    size: lg
    depth: near
    keyart: { webp: "images/helio_realm.webp", avif: "images/helio_realm.avif" }
    content: "content/projects/surya.md"
    narration:
      - >-
        The Sunforge keeps fourteen years of the sun's memory — some 257
        terabytes of it, gathered through thirteen windows onto the burning
        face: eight of AIA's colored glass, five of HMI's. None of the panes
        were ever shrunk; every reading is taken at the native 4096×4096, for
        a prophecy misread at small scale is no prophecy at all.
      - >-
        In the forge's heart a spatio-temporal transformer was raised — 366
        million parameters of spectral gating and long–short attention,
        hammered into shape across 128 A100 furnaces, then taught to roll its
        visions forward hour over hour, and tuned with LoRA charms for each
        new kind of telling.
      - >-
        And the tellings hold. Flares are called a day before they break.
        The solar wind is read four days out, truer than the published
        charts. The extreme-ultraviolet spectrum is recited to within a
        breath of the operational oracle — from one model, not many.
    record:
      role: >-
        Co-developer (NASA IMPACT) — led exploratory data analysis on the
        multi-year solar image archives, trained and benchmarked transformer
        architectures on NVIDIA DGX and NAS clusters via SLURM and PBS,
        fine-tuned the foundation model with LoRA adapters for solar-flare
        and solar-wind prediction, and designed the convolutional baselines.
      results:
        - >-
          Solar-flare forecasting TSS 0.436 (24 h window, M/X threshold) vs.
          0.358 for the AlexNet baseline; solar-wind RMSE 75.92 km/s at
          4-day lead vs. 84–86 km/s for published WindNet variants.
        - >-
          Active-region segmentation IoU 0.768 with only 4.1 M trainable
          parameters, vs. UNet's 0.688 with 9.2 M.
    artifacts:
      - src: "static/images/projects/surya/fig01_sdo_panel.png"
        caption: >-
          The instrument panel Surya reads: 8 AIA channels and 5 HMI products
          from the Solar Dynamics Observatory, used at native 4096×4096
          resolution (May 2010 – Dec 2024, 12-minute cadence).
      - src: "static/images/projects/surya/fig02_surya_arch.png"
        caption: >-
          Surya's architecture — spectral gating plus long–short attention
          blocks, 366 M parameters; 16×16 patches yield 65,536 tokens per
          full-resolution image.
      - src: "static/images/projects/surya/fig03_surya_io_grid.png"
        caption: >-
          Inputs and forecast outputs across channels — zero-shot rollouts
          outperform persistence and learned-flow baselines before any
          task-specific tuning.

