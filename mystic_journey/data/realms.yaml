  - slug: prithvi-wxc
    cluster: works
    status: live
    mythic_name: "The Stormloom"
    professional_name: "Prithvi WxC — Weather & Climate Foundation Model"
    teaser: "High in the Stormloom, 2.3 billion threads weave forty years of weather into forecast."
    palette: { accent: "#6FA1E8", glow: "#2F5DA8" }
    position: { x: 40, y: 18 }
    size: lg
    depth: mid
    keyart: { webp: "images/weather_foundation_model_realm_4k.webp", avif: "images/weather_foundation_model_realm_4k.avif" }
    content: "content/projects/prithvi-wxc.md"
    narration:
      - >-
        High above the clouds the Stormloom works without rest. Forty years
        of the world's weather — MERRA-2, 1980 to 2019, one hundred sixty
        atmospheric threads — feed the loom every three hours, petabytes of
        it carried along pipelines built to cross computing halls that
        never touch the open internet.
      - >-
        The loom itself holds 2.3 billion knots: twenty-five encoder and five
        decoder blocks that learned, first, to restore the sky from torn
        cloth — masked reconstruction — and then to weave it forward in time.
        Its quiet secret: it does not predict the weather itself, but the
        weather's deviation from the long pattern, the climatology.
      - >-
        Show it five percent of the sky and it restores the rest. Set it on
        Hurricane Ida's trail and it tracks her to within 64 kilometers where
        older looms wandered by two hundred. Ask it to sharpen a coarse map
        sixfold and it answers within three-quarters of a degree kelvin.
    record:
      role: >-
        Computer Scientist (NASA IMPACT) — designed and executed end-to-end
        data processing pipelines for the petabyte-scale MERRA-2 reanalysis
        time-series across isolated computing environments, and applied
        LoRA-based parameter-efficient fine-tuning to build task-specific
        downstream models from the pretrained backbone.
      results:
        - >-
          Hurricane Ida track forecasting: mean track error 63.9 km vs.
          201.9 km (MERRA-2 FourCastNet) and 262.3 km (ERA5 FourCastNet);
          landfall error under 5 km.
        - >-
          Statistical downscaling: 6× MERRA-2 T2m RMSE of 0.73 K — roughly
          4× better than nearest-neighbor and bilinear interpolation
          baselines.
    artifacts:
      - src: "static/images/projects/prithvi-wxc/fig04_prithvi_wxc_core.png"
        caption: >-
          The Prithvi WxC core — a 2.3 B-parameter encoder–decoder
          transformer over MERRA-2, modeling deviation from climatology
          rather than raw state.
      - src: "static/images/projects/prithvi-wxc/fig05_prithvi_reconstruction.png"
        caption: >-
          Zero-shot reconstruction: atmospheric state recovered from as
          little as 5% of inputs, with no task-specific tuning.
      - src: "static/images/projects/prithvi-wxc/fig06_hurricane_ida.png"
        caption: >-
          Hurricane Ida (Cat 4) track forecast — 63.9 km mean track error
          vs. 201.9–262.3 km for FourCastNet baselines.
      - src: "static/images/projects/prithvi-wxc/fig07_downscaling.png"
        caption: >-
          Statistical downscaling of surface temperature: 0.73 K RMSE at 6×
          resolution over interpolation baselines at ~3 K.
      - src: "static/images/projects/prithvi-wxc/fig09_momentum_flux.png"
        caption: >-
          Gravity-wave momentum-flux parameterization — spatial correlation
          0.99 (Andes) and 0.97 (Southern Ocean).

  - slug: prithvi-eo
    cluster: works
    status: live
    mythic_name: "The Emerald Meridian"
    professional_name: "Prithvi EO 2.0 — Earth Observation Foundation Model"
    teaser: "From the Emerald Meridian the living Earth is mapped — floods, fires, forests, and fields."
    palette: { accent: "#7FC24E", glow: "#3E7A2A" }
    position: { x: 60, y: 52 }
    size: lg
    depth: near
    keyart:
      webp: "images/prithvi_earth_observation_foundation_model_realm_4k.webp"
      avif: "images/prithvi_earth_observation_foundation_model_realm_4k.avif"
    content: "content/projects/prithvi-eo.md"
    narration:
      - >-
        From the Emerald Meridian the whole living Earth is set down in the
        atlas: 4.2 million glimpses drawn from the Harmonized
        Landsat–Sentinel archive, 2014 to 2023, each glimpse four seasons
        deep and six colors wide, chosen so that every kind of land — every
        ecoregion — has its page.
      - >-
        The cartographer here is a masked autoencoder taught to see in
        space and time at once, with the date and the place whispered into
        its tokens. It was raised in two sizes — 300 and 600 million
        parameters — on the JUWELS Booster supercomputer, and it travels
        with its own toolkit, TerraTorch, so any fieldworker may fine-tune
        it on a single GPU.
      - >-
        Its maps hold under flood and fire: waters traced at 83.1% IoU,
        burn scars at 83.2%, landslides found from only fifty examples —
        and across the twelve trials of GEO-Bench, roughly eight parts in a
        hundred better than the atlas that came before it.
    record:
      role: null   # <!-- TODO: role not stated in content/ — add to
                   # content/projects/prithvi-eo.md or experience.yaml and
                   # mirror it here -->
      results:
        - >-
          ~8% overall improvement over Prithvi-EO-1.0 on the 12-task
          GEO-Bench suite; top performer among the released 300 M / 600 M
          variants.
        - >-
          Flood mapping water IoU 83.1% (vs. 79.6% for EO-1.0) and wildfire
          burn-scar IoU 83.2% (vs. 76.8%).
    artifacts:
      - src: "static/images/projects/prithvi-eo/fig10_prithvi_eo2.png"
        caption: >-
          Prithvi EO 2.0 — masked autoencoder with 3D patch/positional
          embeddings and temporal–location (TL) metadata encoding.
      - src: "static/images/projects/prithvi-eo/fig11_segmentation.png"
        caption: >-
          Downstream segmentation from the benchmark suite — flood, burn
          scar, and crop tasks fine-tuned from the shared backbone.
      - src: "static/images/projects/prithvi-eo/fig12_agb_prediction.png"
        caption: >-
          Above-ground biomass regression — RMSE 33.40 Mg/ha using 12
          Sentinel-2 timestamps.

  - slug: us-ghg-center
    cluster: works
    status: live
    mythic_name: "The Veiled Currents"
    professional_name: "US Greenhouse Gas Center"
    teaser: "Here the unseen breath of the world — carbon and methane — is made visible to any who look."
    palette: { accent: "#3BC4B8", glow: "#1E7A72" }
    position: { x: 28, y: 42 }
    size: md
    depth: mid
    keyart: { webp: "images/greenhouse_gas_center_realm_4k.webp", avif: "images/greenhouse_gas_center_realm_4k.avif" }
    content: "content/projects/us-ghg-center.md"
    narration:
      - >-
        In this realm the air itself keeps ledgers no eye can read — carbon
        rising from cities, methane slipping from unseen seams. Four great
        houses kept their measurements apart: NASA with its satellites,
        NOAA with its reference network, the EPA with its inventories, NIST
        with its urban test beds. The Alchemist's task was to gather them
        into one hall.
      - >-
        The instruments are quiet and exact: Airflow-orchestrated pipelines
        that take each house's raw geospatial offerings and transmute them —
        into Cloud-Optimized GeoTIFFs that stream from object storage, into
        a STAC catalog where any seeker may query them, with a JupyterHub
        standing beside the data so the analysis never has to carry it home.
      - >-
        The hall opened its doors at COP28, in December 2023, presented by
        the NASA and EPA Administrators alongside the White House's national
        Greenhouse Gas Monitoring Strategy — every dataset, algorithm, and
        line of code released open, for scientists, policymakers, and the
        public alike.
    record:
      role: >-
        Data engineer (NASA IMPACT) — automated the end-to-end
        transformation pipelines converting geospatial data to
        Cloud-Optimized GeoTIFFs, orchestrated ingestion workflows with
        Apache Airflow and cataloged outputs into STAC-compliant metadata
        stores, and managed the AWS infrastructure (Lambda, API Gateway,
        EC2) backing the platform.
      results:
        - >-
          Platform unveiled at COP28 (Dec 2023) alongside the White House
          national GHG Monitoring Strategy, making curated datasets from
          four federal agencies programmatically accessible.
        - >-
          Fully automated ingest → COG transformation → STAC registration
          pipeline, eliminating manual processing of contributed datasets.
    artifacts:
      - src: "static/images/projects/us-ghg-center/pipeline_approach.png"
        caption: >-
          The ingest pipeline — Airflow-orchestrated transformation of
          agency data to Cloud-Optimized GeoTIFFs, registered into the
          public STAC catalog.
      - src: "static/images/projects/us-ghg-center/platform_results.png"
        caption: >-
          The US GHG Center platform at earth.gov/ghgcenter — dashboard,
          STAC data services, and a JupyterHub analytics environment beside
          the data.

  - slug: sanoma-recommender
    cluster: works
    status: live
    mythic_name: "The Whispering Stacks"
    professional_name: "Sanoma Media Finland — Recommendation Platform"
    teaser: "In the Whispering Stacks, the shelves learn which story you will reach for next."
    palette: { accent: "#E0AC4F", glow: "#9A6A1F" }
    position: { x: 80, y: 68 }
    size: md
    depth: near
    keyart:
      webp: "images/sanoma_media_finland_recommendation_system_realm_4k.webp"
      avif: "images/sanoma_media_finland_recommendation_system_realm_4k.avif"
    content: "content/projects/sanoma-recommender.md"
    narration:
      - >-
        The Whispering Stacks serve two theaters at once — ruutu.fi, where
        moving pictures play, and supla.fi, where voices are kept. The
        shelves listen for the faintest signals: what was watched, what was
        heard, how long a visitor lingered, what they returned for. From
        these whispers, ALS matrix factorization distills every reader and
        every story into vectors, and matches them at the moment of asking.
      - >-
        The Librarian's work was modernization, not founding. The old
        catalogues were written in Scala; they were carried, shelf by shelf,
        into Python, where the rest of the scholars worked. And because a
        podcast listener does not behave like a video watcher, new
        experiments tuned the whispering differently for supla's rhythms —
        its catalog, its sparsity, its habits of return.
      - >-
        The scores only matter when they reach a reader's hands, so the
        Librarian also tended the carousels themselves — how algorithmic
        rows and the editors' chosen rows share the shelf — so the right
        story arrives in a form worth reaching for.
    record:
      role: >-
        Data Scientist (Sanoma Media Finland) — worked on the production
        ALS collaborative-filtering recommender inside the Sanoma Unified
        Recommendation Framework, integrated with content delivery;
        refactored legacy Scala pipelines into Python, built ALS
        proof-of-concepts for supla.fi, and contributed carousel UX
        feedback with the product team.
      results:
        - >-
          Recommendations served in production through the Unified
          Recommendation Framework, scored at request time across ruutu.fi
          and supla.fi.
        - >-
          Scala→Python pipeline modernization created reusable components
          that accelerated iteration for the data-science team.
    artifacts:
      - src: "static/images/projects/sanoma-recommender/system-overview.png"
        caption: >-
          System overview — events from ruutu.fi and supla.fi feed the
          Unified Recommendation Framework: feature pipeline → ALS →
          request-time scoring into the streaming UI's algorithmic rows.
      - src: "static/images/projects/sanoma-recommender/als-concept.png"
        caption: >-
          ALS matrix factorization — the sparse user–item interaction
          matrix approximated as U × Vᵀ with k latent factors.
      - src: "static/images/projects/sanoma-recommender/carousels.png"
        caption: >-
          How algorithmic and editorial rows coexist — hero banner,
          "Recommended for you," and editorially managed rows in one UI.

