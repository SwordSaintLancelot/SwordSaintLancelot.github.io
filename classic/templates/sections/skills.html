{% import "_icons.html" as icons %}
<section id="skills">
  <h2>Skills</h2>
  <div class="skill-panels">
    {% for group in skills %}
    <div class="skill-panel">
      <div class="skill-panel__head">
        <span class="skill-panel__icon" aria-hidden="true">{{ icons.skill_category(group.category) }}</span>
        <h3 class="skill-panel__title">{{ group.category }}</h3>
      </div>
      <ul class="skill-panel__chips">
        {% for entry in group.entries %}<li class="tag">{{ entry }}</li>{% endfor %}
      </ul>
    </div>
    {% endfor %}
  </div>
</section>
