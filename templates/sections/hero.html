<section class="hero">
  <h1>{{ profile.name }}</h1>
  <p class="title">{{ profile.title }} &middot; {{ profile.affiliation }}</p>
  <p class="tagline">{{ profile.tagline }}</p>
  <p class="meta">{{ profile.location }}</p>
  <ul class="links">
    {% for link in profile.links %}
    <li><a href="{{ link.url }}">{{ link.label }}</a></li>
    {% endfor %}
    {% if profile.resume_pdf %}
    <li><a href="{{ profile.resume_pdf }}">Résumé (PDF)</a></li>
    {% endif %}
  </ul>
</section>
