{% if talks %}
<section id="talks">
  <h2>Talks &amp; Workshops</h2>
  <ul class="entries">
    {% for t in talks %}
    <li class="entry">
      <div class="entry__main">
        <h3 class="entry__title">{{ t.title }}</h3>
        <p class="entry__meta">{{ t.venue }}{% if t.year %} &middot; {{ t.year }}{% endif %}</p>
        {% if t.description %}<p class="entry__desc">{{ t.description }}</p>{% endif %}
      </div>
    </li>
    {% endfor %}
  </ul>
</section>
{% endif %}
