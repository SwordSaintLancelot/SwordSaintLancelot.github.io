<section id="skills">
  <h2>Skills</h2>
  <div class="skill-groups">
    {% for group in skills %}
    <div class="skill-row">
      <div class="skill-label">{{ group.category }}</div>
      <div class="skill-chips">
        {% for entry in group.entries %}<span class="chip">{{ entry }}</span>{% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</section>
